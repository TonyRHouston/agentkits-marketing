name: Release
on:
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm install
    - name: Verify the integrity of provenance attestations and registry signatures
        for installed dependencies
      run: npm audit signatures
    - name: Run tests
      run: npm test
    - name: Run linting
      run: npm run lint
    - name: Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: npm run semantic-release
    - name: Capture release notes
      id: release_notes
      run: "node <<'EOF'\nconst fs = require('fs');\nconst path = 'CHANGELOG.md';\n\
        const maxLength = 1900;\nlet message = '';\nif (fs.existsSync(path)) {\n \
        \ const lines = fs.readFileSync(path, 'utf8').split('\\n');\n  let collecting\
        \ = false;\n  for (const line of lines) {\n    if (line.startsWith('## '))\
        \ {\n      if (!collecting) {\n        collecting = true;\n      } else {\n\
        \        break;\n      }\n    }\n    if (collecting) {\n      message += line\
        \ + '\\n';\n    }\n  }\n  message = message.trim();\n}\nif (!message) {\n\
        \  message = 'Release completed successfully but no changelog entry was found.';\n\
        }\nif (message.length > maxLength) {\n  message = message.slice(0, maxLength\
        \ - 20) + '\\n...[truncated]';\n}\nconst encoded = Buffer.from(message, 'utf8').toString('base64');\n\
        fs.appendFileSync(process.env.GITHUB_OUTPUT, `notes=${encoded}\\n`);\nEOF"
