name: CI
on:
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Run linting
      run: npm run lint
    - name: Run tests
      run: npm test
    - name: Validate plugin.json
      run: "if [ -f \".claude-plugin/plugin.json\" ]; then\n  echo \"Validating plugin.json...\"\
        \n  node -e \"JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json'))\"\
        \n  echo \"plugin.json is valid JSON\"\nfi\n"
    - name: Validate marketplace.json
      run: "if [ -f \".claude-plugin/marketplace.json\" ]; then\n  echo \"Validating\
        \ marketplace.json...\"\n  node -e \"JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json'))\"\
        \n  echo \"marketplace.json is valid JSON\"\nfi\n"
    - name: Check for broken markdown links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: yes
        config-file: .github/mlc_config.json
      continue-on-error: true
  commitlint:
    name: Lint Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Validate commits
      run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{
        github.event.pull_request.head.sha }} --verbose
